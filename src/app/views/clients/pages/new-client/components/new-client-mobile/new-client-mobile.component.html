<ion-header class="ion-no-border">
  <ion-toolbar class="new-client-header-toolbar">
    <div
      class="bg-gradient-to-br from-[#0c4a6e] to-[#0284c7] pt-12 pb-8 px-6 rounded-b-[2rem] shadow-lg text-white"
    >
      <div class="flex items-center mb-2">
        <button
          type="button"
          (click)="onCancel()"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition-colors mr-2"
        >
          <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <div class="flex flex-col">
          <h1 class="text-2xl font-bold tracking-tight">
            {{ 'CLIENTS.NEW_CLIENT.TITLE' | translate }}
          </h1>
        </div>
      </div>
      <p class="text-sky-100/90 text-sm ml-12 font-medium">
        {{ 'CLIENTS.NEW_CLIENT.SUBTITLE' | translate }}
      </p>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="new-client-content">
  <div [formGroup]="clientForm()" class="px-6 py-8 space-y-6">
    <!-- Nombre Input -->
    <div class="space-y-2">
      <label for="client-name" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.NAME' | translate }} <span class="text-rose-500">*</span>
      </label>
      <div class="relative">
        <i
          class="fa-solid fa-building absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
        ></i>
        <input
          type="text"
          id="client-name"
          formControlName="name"
          [placeholder]="'CLIENTS.NEW_CLIENT.FIELDS.NAME_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-4 outline-none transition-all placeholder-slate-400 text-sm font-medium"
        />
      </div>
    </div>

    <!-- Dirección Input -->
    <div class="space-y-2">
      <label for="client-address" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.ADDRESS' | translate }}
      </label>
      <div class="relative">
        <i
          class="fa-solid fa-map-marker-alt absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
        ></i>
        <input
          type="text"
          id="client-address"
          formControlName="address"
          [placeholder]="'CLIENTS.NEW_CLIENT.FIELDS.ADDRESS_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-4 outline-none transition-all placeholder-slate-400 text-sm font-medium"
        />
      </div>
    </div>

    <!-- Teléfono Input -->
    <div class="space-y-2">
      <label for="client-phone" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.PHONE' | translate }} <span class="text-rose-500">*</span>
      </label>
      <div class="relative">
        <i
          class="fa-solid fa-phone absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
        ></i>
        <input
          type="tel"
          id="client-phone"
          formControlName="phone"
          [placeholder]="'CLIENTS.NEW_CLIENT.FIELDS.PHONE_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-4 outline-none transition-all placeholder-slate-400 text-sm font-medium"
        />
      </div>
    </div>

    <!-- Email Input -->
    <div class="space-y-2">
      <label for="client-email" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.EMAIL' | translate }}
      </label>
      <div class="relative">
        <i
          class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
        ></i>
        <input
          type="email"
          id="client-email"
          formControlName="email"
          [placeholder]="'CLIENTS.NEW_CLIENT.FIELDS.EMAIL_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-4 outline-none transition-all placeholder-slate-400 text-sm font-medium"
        />
      </div>
    </div>

    <!-- Tipo Input
        <div class="space-y-2">
            <label for="client-type" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.TYPE' | translate }}
      </label>
            <div class="relative">
                <i class="fa-solid fa-tags absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                <select id="client-type" formControlName="type" class="w-full appearance-none bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-10 outline-none transition-all text-sm font-medium">
          <option value="">{{ 'CLIENTS.NEW_CLIENT.FIELDS.TYPE_SELECT' | translate }}</option>
          <option value="hotel">{{ 'CLIENTS.NEW_CLIENT.TYPE_OPTIONS.HOTEL' | translate }}</option>
          <option value="restaurant">
            {{ 'CLIENTS.NEW_CLIENT.TYPE_OPTIONS.RESTAURANT' | translate }}
          </option>
          <option value="retail">{{ 'CLIENTS.NEW_CLIENT.TYPE_OPTIONS.RETAIL' | translate }}</option>
          <option value="corporate">
            {{ 'CLIENTS.NEW_CLIENT.TYPE_OPTIONS.CORPORATE' | translate }}
          </option>
        </select>
                <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
        </div> -->

    <!-- Additional Information -->
    <div class="space-y-2">
      <label for="client-desc" class="block text-slate-700 font-semibold text-sm ml-1">
        {{ 'CLIENTS.NEW_CLIENT.FIELDS.DESCRIPTION' | translate }}
      </label>
      <div class="relative">
        <i
          class="fa-solid fa-note-sticky absolute left-3.5 top-4 text-slate-400 pointer-events-none"
        ></i>
        <textarea
          id="client-desc"
          formControlName="description"
          rows="4"
          [placeholder]="'CLIENTS.NEW_CLIENT.MOBILE.DESCRIPTION_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-100 text-slate-800 rounded-xl py-3.5 pl-11 pr-4 outline-none transition-all placeholder-slate-400 text-sm font-medium resize-none"
        ></textarea>
      </div>
    </div>

    <!-- Extra padding at bottom to ensure content isn't hidden by fixed footer -->
    <div class="h-20"></div>
  </div>

  <!-- Fixed Bottom Actions -->
  <div
    class="new-client-footer bg-white border-t border-slate-100 p-6 pb-8 space-y-3 shadow-[0_-4px_20px_rgba(0,0,0,0.04)] rounded-t-3xl"
  >
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="isSubmitting()"
      class="action-button action-button--primary w-full bg-[#0088cc] text-white font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 shadow-md hover:bg-[#0077bb] transition-all transform active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed"
    >
      <i class="fa-regular fa-floppy-disk text-lg"></i>
      <span>{{
        (isSubmitting()
          ? 'CLIENTS.NEW_CLIENT.BUTTONS.CREATING'
          : 'CLIENTS.NEW_CLIENT.BUTTONS.CREATE'
        ) | translate
      }}</span>
    </button>
    <button
      type="button"
      (click)="onCancel()"
      class="action-button action-button--secondary w-full bg-slate-100 text-slate-700 font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-200 transition-all transform active:scale-[0.98] border border-slate-200"
    >
      {{ 'CLIENTS.NEW_CLIENT.BUTTONS.CANCEL' | translate }}
    </button>
  </div>
</ion-content>
