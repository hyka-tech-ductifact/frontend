<div class="new-project-mobile-shell">
  <ion-header class="ion-no-border">
    <ion-toolbar class="new-project-header-toolbar">
      <div
        class="pt-12 pb-8 px-6 rounded-b-[2rem] shadow-lg text-white"
        style="background: linear-gradient(135deg, #0c4a6e 0%, #0284c7 50%, #38bdf8 100%)"
      >
        <div class="flex items-center mb-2">
          <button
            type="button"
            (click)="onCancel()"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white/15 hover:bg-white/25 transition-colors mr-2"
          >
            <i class="fa-solid fa-arrow-left text-xl"></i>
          </button>
          <div class="flex flex-col">
            <h1 class="text-2xl font-bold tracking-tight">
              {{ 'CLIENTS.NEW_PROJECT.TITLE' | translate }}
            </h1>
          </div>
        </div>
        <p class="text-white/95 text-sm ml-12 font-medium">
          {{ 'CLIENTS.NEW_PROJECT.SUBTITLE' | translate }}
        </p>
      </div>
    </ion-toolbar>
  </ion-header>

  <ion-content class="new-project-content">
    <div [formGroup]="projectForm()" class="new-project-scroll px-6 pt-8 pb-4 space-y-6">
      @if (errorMessage()) {
        <div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
          {{ errorMessage() | translate }}
        </div>
      }

      <div class="space-y-2">
        <label for="project-name-mobile" class="block text-slate-700 font-semibold text-sm ml-1">
          {{ 'CLIENTS.NEW_PROJECT.FIELDS.NAME' | translate }}
          <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          id="project-name-mobile"
          formControlName="name"
          [placeholder]="'CLIENTS.NEW_PROJECT.FIELDS.NAME_PLACEHOLDER' | translate"
          class="w-full bg-sky-50/50 border border-sky-100 text-slate-800 text-sm rounded-xl focus:bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 block p-4 outline-none transition-all duration-200 placeholder-slate-400 font-medium"
        />
      </div>

      <div class="space-y-2">
        <label for="project-address-mobile" class="block text-slate-700 font-semibold text-sm ml-1">
          {{ 'CLIENTS.NEW_PROJECT.FIELDS.ADDRESS' | translate }}
          <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          id="project-address-mobile"
          formControlName="address"
          [placeholder]="'CLIENTS.NEW_PROJECT.FIELDS.ADDRESS_PLACEHOLDER' | translate"
          class="w-full bg-sky-50/50 border border-sky-100 text-slate-800 text-sm rounded-xl focus:bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 block p-4 outline-none transition-all duration-200 placeholder-slate-400 font-medium"
        />
      </div>

      <div class="space-y-2">
        <label for="project-manager-mobile" class="block text-slate-700 font-semibold text-sm ml-1">
          {{ 'CLIENTS.NEW_PROJECT.FIELDS.MANAGER_NAME' | translate }}
          <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          id="project-manager-mobile"
          formControlName="managerName"
          [placeholder]="'CLIENTS.NEW_PROJECT.FIELDS.MANAGER_NAME_PLACEHOLDER' | translate"
          class="w-full bg-sky-50/50 border border-sky-100 text-slate-800 text-sm rounded-xl focus:bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 block p-4 outline-none transition-all duration-200 placeholder-slate-400 font-medium"
        />
      </div>

      <div class="space-y-2">
        <label for="project-phone-mobile" class="block text-slate-700 font-semibold text-sm ml-1">
          {{ 'CLIENTS.NEW_PROJECT.FIELDS.PHONE' | translate }}
          <span class="text-rose-500">*</span>
        </label>
        <input
          type="tel"
          id="project-phone-mobile"
          formControlName="phone"
          [placeholder]="'CLIENTS.NEW_PROJECT.FIELDS.PHONE_PLACEHOLDER' | translate"
          class="w-full bg-sky-50/50 border border-sky-100 text-slate-800 text-sm rounded-xl focus:bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 block p-4 outline-none transition-all duration-200 placeholder-slate-400 font-medium"
        />
      </div>

      <div class="space-y-2">
        <label
          for="project-description-mobile"
          class="block text-slate-700 font-semibold text-sm ml-1"
        >
          {{ 'CLIENTS.NEW_PROJECT.FIELDS.DESCRIPTION' | translate }}
        </label>
        <textarea
          id="project-description-mobile"
          formControlName="description"
          rows="4"
          [placeholder]="'CLIENTS.NEW_PROJECT.FIELDS.DESCRIPTION_PLACEHOLDER' | translate"
          class="w-full bg-sky-50/50 border border-sky-100 text-slate-800 text-sm rounded-xl focus:bg-white focus:border-sky-400 focus:ring-2 focus:ring-sky-100 block p-4 outline-none transition-all duration-200 placeholder-slate-400 font-medium resize-none"
        ></textarea>
      </div>
    </div>

    <div class="new-project-footer-shell">
      <div
        class="new-project-footer bg-white border-t border-sky-100 p-4 sm:p-6 space-y-3 shadow-[0_-12px_30px_rgba(15,23,42,0.08)] rounded-t-3xl pointer-events-auto"
      >
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="isSubmitting()"
          class="w-full bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 active:from-sky-800 active:to-blue-800 text-white font-semibold rounded-2xl py-4 px-4 shadow-float flex items-center justify-center gap-3 active:scale-[0.98] transition-all disabled:opacity-60 disabled:cursor-not-allowed pointer-events-auto"
        >
          <i class="fa-regular fa-floppy-disk text-lg"></i>
          <span>{{
            (isSubmitting()
              ? 'CLIENTS.NEW_PROJECT.BUTTONS.CREATING'
              : 'CLIENTS.NEW_PROJECT.BUTTONS.CREATE'
            ) | translate
          }}</span>
        </button>
        <button
          type="button"
          (click)="onCancel()"
          class="w-full bg-white text-slate-700 font-semibold rounded-2xl py-4 px-4 border border-sky-100 hover:bg-sky-50 active:scale-[0.98] transition-all pointer-events-auto"
        >
          {{ 'CLIENTS.NEW_PROJECT.BUTTONS.CANCEL' | translate }}
        </button>
      </div>
    </div>
  </ion-content>
</div>
