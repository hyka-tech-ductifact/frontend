<ion-header class="ion-no-border">
  <ion-toolbar class="new-order-modal-toolbar">
    <ion-title class="new-order-modal-title">{{ 'ORDERS.FORM.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        class="custom-rounded-btn"
        [attr.aria-label]="'ORDERS.FORM.CANCEL' | translate"
        (click)="dismissModal()"
      >
        <i class="fa-solid fa-xmark text-lg text-slate-400"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="new-order-modal-content">
  <form [formGroup]="orderForm" (ngSubmit)="submitOrder()" class="p-6 space-y-5">
    <!-- Name Field -->
    <div class="space-y-2">
      <label for="order-name" class="block text-sm font-semibold text-slate-700 ml-1">
        {{ 'ORDERS.FORM.NAME' | translate }}&nbsp;<span class="text-rose-500">*</span>
      </label>
      <div class="relative input-focus-ring rounded-xl transition-all duration-200">
        <input
          type="text"
          id="order-name"
          formControlName="code"
          [placeholder]="'ORDERS.FORM.NAME_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:border-sky-400 focus:bg-white block p-4 outline-none transition-all font-medium placeholder-slate-400"
        />
      </div>
    </div>

    <!-- Description Field -->
    <div class="space-y-2">
      <label for="order-desc" class="block text-sm font-semibold text-slate-700 ml-1">
        {{ 'ORDERS.FORM.DESCRIPTION' | translate }} <span class="text-rose-500">*</span>
      </label>
      <div class="relative input-focus-ring rounded-xl transition-all duration-200">
        <textarea
          id="order-desc"
          rows="4"
          formControlName="description"
          [placeholder]="'ORDERS.FORM.DESCRIPTION_PLACEHOLDER' | translate"
          class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:border-sky-400 focus:bg-white block p-4 outline-none resize-none transition-all font-medium placeholder-slate-400"
        ></textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit" [disabled]="orderForm.invalid" class="submit-form-btn">
        <span>{{ 'ORDERS.FORM.CREATE' | translate }}</span>
        <i
          class="fa-solid fa-arrow-right text-sm opacity-70 group-hover:translate-x-1 transition-transform"
        ></i>
      </button>
    </div>
  </form>
</ion-content>
